<header style="text-align:center; margin-top:30px;">
    OSTATNIE FILMY POSTTEAM

<section class="video-list" id="videoList"></section>

<script>
const API_KEY = "AIzaSyAof3iwZ243LJfIyE9HeRq2sEFxZOWSdIg";
const PLAYLIST_ID = "UUUKTbDAYSSUQzyAQWhFC23Q";

async function loadVideos() {
    const res = await fetch(
        `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=10&playlistId=${PLAYLIST_ID}&key=${API_KEY}`
    );
    const data = await res.json();

    const container = document.getElementById("videoList");

    data.items.forEach(item => {
        const videoId = item.snippet.resourceId.videoId;
        const title = item.snippet.title;

        const card = document.createElement("div");
        card.className = "video-card";

        card.innerHTML = `
            <iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>
            <div class="video-title">${title}</div>
        `;

        container.appendChild(card);
    });
}

loadVideos();
const initHamburger = () => {
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');

    if (hamburger && navLinks) {
        hamburger.onclick = () => {
            navLinks.classList.toggle('active');
            
            // Animacja kresek w "X"
            const spans = hamburger.querySelectorAll('span');
            if (navLinks.classList.contains('active')) {
                spans[0].style.transform = 'rotate(45deg) translate(5px, 5px)';
                spans[1].style.opacity = '0';
                spans[2].style.transform = 'rotate(-45deg) translate(7px, -7px)';
            } else {
                spans[0].style.transform = 'none';
                spans[1].style.opacity = '1';
                spans[2].style.transform = 'none';
            }
        };
    }
};

// Uruchom funkcję po załadowaniu strony
initHamburger();
</script>
